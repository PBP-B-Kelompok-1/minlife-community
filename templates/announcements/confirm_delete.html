{% extends "base.html" %}

{% block meta %}
    <title>Delete Announcement - Minlife Community</title>
{% endblock meta %}

{% block content %}
    <div class="mx-auto flex w-full max-w-xl flex-col gap-6 px-4 pb-12 pt-4 sm:px-6">
        <section class="rounded-[var(--radius)] bg-[var(--paper)] p-5 shadow sm:p-7">
            <div class="flex flex-col gap-3">
                <span class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-xl text-[var(--danger)]">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                </span>
                <h1 class="m-0 text-2xl font-semibold text-[var(--secondary)]">
                    Delete announcement?
                </h1>
                <p class="m-0 text-[var(--secondary)]">
                    You are about to permanently delete
                    <strong>{{ announcement.title }}</strong>. This action cannot be undone.
                </p>
            </div>

            <form method="post" class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                {% csrf_token %}
                <a
                    href="{% url 'announcements:detail' announcement.id %}"
                    class="button button--border"
                >
                    Cancel
                </a>
                <button
                    type="submit"
                    class="button !border-[var(--danger)] !bg-[var(--danger)]"
                >
                    Delete Announcement
                </button>
            </form>
        </section>
    </div>
{% endblock content %}
