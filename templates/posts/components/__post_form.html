{# required: form_action, form #}
<form method="POST" action="{% url "posts:create_post" %}" class="post-form">
    {% csrf_token %}
    {% for field in form %}
        <div class="post-form__field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <div class="post-form__actions">
        <button class="button" type="submit">Upload</button>
        <a href="" class="button button--border">Cancel</a>
    </div>
</form>
