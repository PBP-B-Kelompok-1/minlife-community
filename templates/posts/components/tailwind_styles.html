<style type="text/tailwindcss">
    .posts { @apply flex flex-col gap-6; }
    .posts__status:empty, .comments__status:empty { @apply hidden; }
    .post { @apply relative flex flex-col gap-3 rounded-[var(--radius)] bg-[var(--paper)] px-5 py-4; }
    .post * { @apply h-auto max-w-full; }
    .post > :empty { @apply hidden; }
    .post__show-anchor { @apply absolute inset-0; }
    .post__title * { @apply text-[1.75rem] font-bold; }
    .post__tags { @apply relative flex gap-1.5; }
    .post__content { @apply flex flex-col gap-3; }
    .post__content * { @apply rounded-[var(--radius)]; }
    .post__actions { @apply flex items-center justify-between; }
    .post__actions--left, .post__actions--right { @apply relative flex gap-3; }
    .post__actions__vote, .comment__actions__vote { @apply gap-[.3rem] p-0; }
    .post__actions__vote button, .comment__actions__vote button { @apply w-fit cursor-pointer rounded-[100rem] border-0 bg-[initial] p-[.6rem] transition-all duration-200 ease-in-out; }
    .comment__actions__vote button { @apply p-2; }
    .post__actions__upvote.upvoted, .comment__actions__upvote.upvoted { @apply text-[var(--success)]; }
    body.has-hover .post__actions__upvote:hover, body.has-hover .comment__actions__upvote:hover { @apply bg-[var(--accent)] text-[var(--success)]; }
    .post__actions__downvote.downvoted, .comment__actions__downvote.downvoted { @apply text-[var(--danger)]; }
    body.has-hover .post__actions__downvote:hover, body.has-hover .comment__actions__downvote:hover { @apply bg-[var(--accent)] text-[var(--danger)]; }

    .post-form-container { @apply flex self-stretch flex-col gap-5 rounded-[var(--radius)] bg-[var(--paper)] px-5 py-4; }
    .post-form { @apply flex flex-col gap-5; }
    .post-form__field { @apply flex flex-col gap-2; }
    .post-form__field[hidden] { @apply hidden; } /* the previous flex overrode the hidden property */
    .post-form__actions { @apply flex justify-end gap-2; }
    @media (max-width: 600px) { .post-form__actions { @apply flex-col; } }

    .comments { @apply flex flex-col gap-4; }
    .comment, .comment-form { @apply grid gap-x-5 gap-y-4 rounded-[var(--radius)] bg-[var(--paper)] p-5; grid-template-rows: repeat(2, fit-content(100%)); grid-template-columns: fit-content(100%) minmax(0, 1fr); }
    .comment:target { -webkit-animation: highlight 1s linear forwards; animation: highlight 1s linear forwards; }
    @-webkit-keyframes highlight { 0%, 100% { background: var(--paper); } 50% { background: var(--accent); } }
    @keyframes highlight { 0%, 100% { background: var(--paper); } 50% { background: var(--accent); } }
    .comment__pfp, .comment-form__pfp { @apply my-auto flex size-[2.8125rem] aspect-square items-center gap-2.5 rounded-[100rem]; grid-row: 1 / span 1; grid-column: 1 / span 1; }
    .comment__body, .comment-form__inputs { @apply flex flex-col items-start gap-[0.3125rem] justify-self-stretch; grid-row: 1 / span 1; grid-column: 2 / span 1; }
    .comment__actions, .comment-form__actions { @apply flex items-center justify-start gap-2.5 justify-self-stretch; grid-row: 2 / span 1; grid-column: 1 / span 2; }
    .comment-form__actions { @apply justify-end; }
    .comment__reply-form { @apply mt-1 border border-[var(--accent)] shadow-none; grid-column: 1 / span 2; }
    .comment__reply-form textarea { @apply min-h-16 w-full resize-y; }
    .comment__body__username, .comment__replies-to { @apply text-base font-normal text-[var(--tertiary)]; font-family: Quicksand; }
    .comment__body__username:hover, .comment__replies-to:hover { @apply text-[var(--accent)]; }
    .comment__replies { @apply flex flex-col gap-4 pl-8; }
    .comment__replies > .comment__replies > .comment__replies { @apply pl-0; }
    .comment__replies .comment__replies-to { grid-row: 1 / span 1; grid-column: 1 / span 2; }
    .comment__replies .comment__pfp { grid-row: 2 / span 1; grid-column: 1 / span 1; }
    .comment__replies .comment__body { grid-row: 2 / span 1; grid-column: 2 / span 1; }
    .comment__replies .comment__actions { grid-row: 3 / span 1; grid-column: 1 / span 2; }
    .comment-form__inputs, .comment-form__field, .comment-form__field .ck-editor { @apply w-full min-w-0; }
    .comment-form__field .ck-editor__editable_inline { min-height: 4rem !important; max-height: 12rem; }
</style>
