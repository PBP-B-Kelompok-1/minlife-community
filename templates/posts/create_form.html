{% extends "base.html" %}
{% load static %}
{% block meta %}
    <link href="{% static "posts/css/styles.css" %}" rel="stylesheet">
    <title>Minlife Community - Create Post</title>
    {{ form.media }}
    <!-- Choices: a JQuery-less selection tool -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>
{% endblock meta %}
{% block content %}
    <div class="container">
        <section class="post-form--create shadow">
            <h1 class="post-form__title">Make a new post</h1>
            <form method="POST" action="{% url "posts:create_post" %}" class="post-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="post-form__field">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}
                <div class="post-form__actions">
                    <button class="button" type="submit">Submit</button>
                    <a href="" class="button button--border">Cancel</a>
                </div>
            </form>
        </section>
    </div>
    <script>
        const choices = new Choices(document.querySelector("select"), {
            removeItemButton: true,
        });
    </script>

{% endblock content %}
