<dialog
    aria-labelledby="delete-title"
    class="fixed left-1/2 top-1/2 m-0 -translate-x-1/2 -translate-y-1/2 rounded-[var(--radius)] bg-[var(--paper)] p-0 shadow-xl"
>
    <div class="w-[min(90vw,32rem)] p-6">
        <p class="text-sm font-semibold uppercase tracking-[0.16em] text-red-700">Konfirmasi moderator</p>
        <h2 id="delete-title" class="mt-2 text-2xl font-bold">Hapus challenge?</h2>
        {% if error %}
            <p class="mt-3 text-red-700" role="alert">{{ error }}</p>
        {% else %}
            <p class="mt-3 text-[var(--secondary)]">Challenge <strong>{{ challenge.title }}</strong> dan submission terkait akan dihapus. Badge yang sudah diperoleh tetap dipertahankan.</p>
        {% endif %}
        <form method="post" action="{% url 'weeklychallenge:challenge_delete' challenge.pk %}"
            hx-post="{% url 'weeklychallenge:challenge_delete' challenge.pk %}" hx-target="#modal-slot" hx-swap="innerHTML"
            class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            {% csrf_token %}
            <input type="hidden" name="origin" value="{{ request.GET.origin|default:'list' }}">
            <button type="button" class="button button--border button--small" onclick="this.closest('dialog').close()">Batal</button>
            {% if not error %}<button class="button button--small border-red-700 bg-red-700" type="submit" hx-disabled-elt="this">Hapus challenge</button>{% endif %}
        </form>
    </div>
</dialog>
