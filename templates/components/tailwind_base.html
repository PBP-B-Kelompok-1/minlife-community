<style type="text/tailwindcss">
    @tailwind utilities;

    * { @apply m-0 box-border p-0; }

    :root {
        font-size: 16px;
        scroll-behavior: smooth;
        scroll-padding-top: 8rem;
        overflow-wrap: break-word;
        --paper: #FFFFFF;
        --paper-dim: #F4F4F6;
        --ink: #000000;
        --ink-light: var(--paper);
        --secondary: #252537;
        --tertiary: #8F8F99;
        --accent: #7373A6;
        --success: #52DE4F;
        --danger: #F12E42;
        --danger-hover: #C11A12;
        --danger-light: #FFB6C1;
        --line: var(--accent);
        --radius: 1.25rem;
        --container-max-width: 800px;
    }

    body { @apply flex min-h-screen flex-col bg-[var(--paper-dim)] text-[var(--ink)] bg-fixed leading-[1.4]; font-family: "Quicksand", Roboto, Helvetica, Arial, -apple-system, serif; }
    .container { @apply mx-auto my-2 flex w-[min(100%,var(--container-max-width))] flex-col gap-6 px-4; }
    .sticky--bottom { @apply sticky bottom-4 mx-4 text-right; }
    button { @apply cursor-pointer; }
    .hover--expand { @apply transition-all duration-[400ms] ease-in-out; }
    body.has-hover .hover--expand:hover { @apply scale-[1.02]; }
    a { @apply no-underline; }
    .empty-state { @apply text-[var(--tertiary)] italic; }
    .shadow { @apply shadow-[2px_2px_8px_2px_rgba(0,0,0,0.25)]; }
    @layer base {
        h1 { @apply text-2xl font-bold sm:text-3xl lg:text-3xl; }
        h2 { @apply text-xl font-bold sm:text-2xl lg:text-2xl; }
        h3 { @apply text-lg font-semibold sm:text-xl lg:text-xl; }
        h4 { @apply text-base font-semibold sm:text-lg lg:text-xl; }
        h5 { @apply text-sm font-semibold sm:text-base lg:text-lg; }
        h6 { @apply text-sm font-semibold sm:text-base lg:text-lg; }
    }

    .button { @apply inline-flex items-center justify-center gap-2.5 rounded-[var(--radius)] border-2 border-[var(--secondary)] bg-[var(--secondary)] px-7 py-3 text-lg text-[var(--ink-light)] transition-all duration-200 ease-in-out; font-family: inherit; }
    body.has-hover .button:hover { @apply border-[var(--accent)] bg-[var(--accent)]; }
    .button--no-hover { border-color: initial !important; background-color: initial !important; }
    .button--border { @apply bg-transparent text-[var(--secondary)]; }
    .button--small { @apply px-3 py-[0.3rem] text-base; }
    .button--danger { @apply bg-[var(--danger)] text-[var(--paper)] border-none; }
    .button--danger:hover { background-color: var(--danger-hover) !important; }
    .button--disabled, .button:disabled { @apply cursor-not-allowed border-[var(--tertiary)] bg-[var(--paper-dim)] text-[var(--tertiary)] opacity-70; }
    .button--disabled, .button:disabled { background-color: var(--paper-dim) !important; }
    body.has-hover .button--disabled:hover, body.has-hover .button:disabled:hover { @apply border-[var(--tertiary)] bg-[var(--paper-dim)]; }

    header { @apply sticky top-4 z-10 m-4; }
    .navbar { @apply flex w-auto items-center justify-between rounded-[var(--radius)] bg-[var(--secondary)] px-6 py-4 text-[var(--ink-light)] lowercase; color: var(--ink-light) !important; }
    .navbar__nav { @apply flex items-center justify-center gap-6; }
    .navbar a, .navbar button { @apply border-b-[.1rem] border-transparent text-[var(--ink-light)] transition-all duration-200 ease-in-out; }
    .navbar a:hover, .navbar button:hover { @apply border-[var(--ink-light)]; }
    .navbar .nav-user { @apply font-semibold }
    .navbar .nav-logout { @apply text-[var(--danger-light)] }
    .navbar .nav-logout:hover { @apply border-[var(--danger-light)] }
    .navbar__menu-button { @apply hidden border-0 bg-transparent p-1 text-xl text-[var(--ink-light)]; }
    .navbar__backdrop, .navbar__drawer { @apply hidden; }
    @media (max-width: 760px) {
        .navbar { @apply px-5 py-3; }
        .navbar__nav { @apply hidden; }
        .navbar__menu-button { @apply inline-flex items-center justify-center; }
        .navbar__menu-button:hover { @apply border-0 text-[var(--paper-dim)]; }
        .navbar__backdrop { @apply fixed inset-0 z-20 bg-black/50 opacity-0 transition-opacity duration-200; }
        .navbar__drawer { @apply fixed inset-y-0 right-0 z-30 flex w-[min(84vw,22rem)] translate-x-full flex-col bg-[var(--secondary)] p-6 text-[var(--ink-light)] shadow-[-4px_0_16px_rgba(0,0,0,0.25)] transition-transform duration-200 ease-out; }
        .navbar__drawer-header { @apply flex items-center justify-between gap-4 text-lg; }
        .navbar__close-button { @apply border-0 bg-transparent p-1 text-2xl text-[var(--ink-light)]; }
        .navbar__drawer-nav { @apply mt-10 flex flex-col items-stretch gap-2; }
        .navbar__drawer-nav a, .navbar__drawer-nav button { @apply block w-full rounded-lg border-0 px-3 py-3 text-left text-[var(--ink-light)] transition-colors duration-200; }
        .navbar__drawer-nav a:hover, .navbar__drawer-nav button:hover { @apply bg-white/10; }
        .navbar__drawer-nav .nav-user { @apply px-3 py-3 text-sm font-semibold text-[var(--paper-dim)]; }
        .navbar__drawer-nav .nav-logout { @apply text-[var(--danger-light)]; }
        .mobile-menu-open { @apply overflow-hidden; }
        .mobile-menu-open .navbar__backdrop { @apply block opacity-100; }
        .mobile-menu-open .navbar__drawer { @apply flex translate-x-0; }
    }

    input, textarea { @apply w-full rounded-[var(--radius)] border border-[var(--accent)] bg-[var(--paper)] p-[0.7rem] transition-[border-color,outline-color] duration-200 ease-in-out; font: inherit; }
    input:focus, textarea:focus { @apply border-[var(--accent)] outline-2 outline-[var(--accent)]; }
    select, .choices { @apply block rounded-[var(--radius)] border border-[var(--accent)] bg-[var(--paper)] leading-[1.1]; font-family: inherit; cursor: pointerj; }
    .choices .choices__inner { border-radius: var(--radius) !important; }
    .choices .choices__list.choices__list--dropdown { border-radius: var(--radius) !important; border: 1px solid var(--accent); }
    .swal2-popup { @apply mt-20; }
</style>
