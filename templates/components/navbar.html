<header>
    <div id="navbar" class="navbar shadow">
        <div class="navbar__title">
            <a href="{% url "frontpage" %}"><strong>minlife</strong> community<a>
        </div>
        <!-- TODO: make mobile version -->
        <nav class="navbar__nav">
            <a href="{% url "frontpage" %}">home</a>
            <a href="{% url "journal:show_journal" %}">journal</a>
            <a href="{% url "weeklychallenge:show_weekly_challenge" %}">weekly challenge</a>
            {% if user.is_authenticated %}
                <a href="{% url 'users:show_my_profile' %}">profile</a>
                <span class="nav-user">{{ user.username }}</span>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-logout">logout</button>
                </form>
            {% else %}
                <a href="{% url 'users:login' %}">Login</a>
                <a href="{% url 'users:register' %}">Register</a>
            {% endif %}
        </nav>
    </div>
</header>
