# i thought workflows are for *deployment*, but it aint compatible with how we push to PWS...
# Deployment is still manual (push to PWS, input username and password)
# too late to make these but eh
name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django deployment checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Build Tailwind assets
        run: python manage.py tailwind build
