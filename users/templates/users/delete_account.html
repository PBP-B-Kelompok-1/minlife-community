{% extends "base.html" %}
{% block content %}
<h2>Delete account</h2>

<p>
  This permanently deletes your account, including your profile and social links.
  This cannot be undone.
</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete my account</button>
  <a href="{% url 'users:show_my_profile' %}">Cancel</a>
</form>
{% endblock %}
